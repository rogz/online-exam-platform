# Everything on one server (e.g. an AWS Lightsail or EC2 instance):
#   the website, a PostgreSQL database, and Caddy for free automatic HTTPS.
# Easiest: let GitHub deploy it (see "Your own server" in the README and deploy/setup.sh).
# By hand: copy .env.example to .env, fill it in, point your domain to the server, run: docker compose up -d
name: exam-wizard
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://exam:${POSTGRES_PASSWORD}@db:5432/exam?sslmode=disable
    depends_on: [db]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_DB: exam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes:
      - caddydata:/data
    depends_on: [app]

volumes:
  dbdata:
  caddydata:
