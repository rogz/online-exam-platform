<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloaded exams — {site}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/exam/styles.css">
</head>
<body>
  <header class="topbar"><div class="brand">{site}</div></header>
  <main>
    <section class="card">
      <h1>📥 Exams downloaded on this device</h1>
      <p class="muted">These exams can be opened without internet. Your teacher gives you the password when the exam starts.</p>
      <ul id="list" class="offline-list"><li class="muted">Looking…</li></ul>
      <p class="small muted">Use the same browser you downloaded with. Don't clear this browser's data before you have sent your answers.</p>
      <a class="btn" href="/student">← My Exams (needs internet)</a>
    </section>
  </main>
<script>
(function () {
  const list = document.getElementById('list');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const req = indexedDB.open('exam-wizard', 1);
  req.onupgradeneeded = () => { const d = req.result; if (!d.objectStoreNames.contains('packages')) d.createObjectStore('packages'); if (!d.objectStoreNames.contains('snaps')) d.createObjectStore('snaps', { autoIncrement: true }); };
  req.onerror = () => { list.innerHTML = '<li>This browser cannot keep downloaded exams.</li>'; };
  req.onsuccess = () => {
    const out = [];
    const t = req.result.transaction('packages', 'readonly');
    t.objectStore('packages').openCursor().onsuccess = (e) => {
      const c = e.target.result;
      if (c) { if (c.value && c.value.meta && typeof c.key === 'string' && !c.key.startsWith('open:')) out.push(c.value); c.continue(); return; }
      if (!out.length) { list.innerHTML = '<li class="muted">No exams are downloaded on this device.</li>'; return; }
      list.innerHTML = out.map((p) => {
        let st = null; try { st = JSON.parse(localStorage.getItem('exam-offline:' + p.packageId) || 'null'); } catch (err) { st = null; }
        const tag = !st ? 'Ready' : st.status === 'IN_PROGRESS' ? 'In progress' : st.status === 'SENT' ? 'Sent ✓' : 'Finished: not sent yet';
        return '<li><a class="btn primary" href="/exam?id=' + encodeURIComponent(p.meta.id) + '">' + esc(p.meta.title) + '</a> <span class="muted">' + esc(p.meta.className || '') +
          (p.meta.startText ? ' · ' + esc(p.meta.startText) : '') + '</span> <span class="tag">' + esc(tag) + '</span></li>';
      }).join('');
    };
  };
})();
</script>
</body>
</html>
