<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>New password — {site}</title>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<main class="wrap" style="max-width:460px;margin:40px auto;padding:0 16px">
  <div class="panel"><div class="hd"><h2>Choose a new password</h2></div><div class="bd">
    <form id="resetForm" novalidate>
      <div class="field"><label for="rpNew">New password</label><input type="password" id="rpNew" autocomplete="new-password"><div class="hint">At least 8 characters.</div></div>
      <div class="field"><label for="rpAgain">Type it again</label><input type="password" id="rpAgain" autocomplete="new-password"></div>
      <div id="rpMsg" class="note bad" hidden></div>
      <button type="submit" class="btn primary big" id="rpSave">Save and sign in</button>
    </form>
  </div></div>
</main>
<script src="/assets/common.js"></script>
<script>
(async function () {
  const { $, api } = App;
  const token = new URLSearchParams(location.search).get('token') || '';
  history.replaceState(null, '', '/reset'); // keep the secret link out of the address bar and history
  try { const me = await api('/auth/me', undefined, { allowSignedOut: true }); App.renderTopbar(null, me.site, []); } catch (e) { /* page still works */ }
  const show = (t) => { $('#rpMsg').textContent = t; $('#rpMsg').hidden = false; };
  if (!/^[0-9a-f]{64}$/.test(token)) { show('This link is not complete. Open the link from the email again, or ask for a new one with "Forgot password?" on the sign-in page.'); $('#rpSave').disabled = true; }
  $('#resetForm').onsubmit = async (e) => {
    e.preventDefault(); $('#rpMsg').hidden = true;
    if ($('#rpNew').value !== $('#rpAgain').value) return show('The two passwords are not the same.');
    $('#rpSave').disabled = true;
    try {
      const r = await api('/auth/reset', { token, password: $('#rpNew').value });
      App.toast('Password changed. You are signed in.');
      setTimeout(() => { location.href = App.homeFor(r.user); }, 900);
    } catch (err) { show(err.message); $('#rpSave').disabled = false; }
  };
})();
</script>
</body>
</html>
